name: Daily Facebook content

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "Only validate the content plan; do not generate or publish media"
        required: false
        type: boolean
        default: true
      test_photo_only:
        description: "Generate and publish one test photo immediately"
        required: false
        type: boolean
        default: false
      verify_feed_only:
        description: "Inspect recent published photo permalink and attachment without publishing"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: payal-ai-automation-state
  cancel-in-progress: false

jobs:
  schedule-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate experiment plan without API calls
        run: python publish_experiment_content.py/publish_experiment_content.py --dry-run

      - name: Generate and schedule one test photo
        if: github.event_name == 'workflow_dispatch' && inputs.test_photo_only == true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
          TIMEZONE: Asia/Kolkata
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL || 'black-forest-labs/flux.2-klein-4b' }}
        run: |
          python - <<'PY'
          import io
          import os
          import random
          import runpy

          publisher = runpy.run_path("publish_experiment_content.py/publish_experiment_content.py")
          api_key = os.environ["POLLINATIONS_API_KEY"].strip()
          page_id = os.environ["FB_PAGE_ID"].strip()
          page_token = os.environ["FB_PAGE_ACCESS_TOKEN"].strip()
          scene_name, scene_description = publisher["PHOTO_SCENES"][0]
          prompt = (
              "Photorealistic documentary-style family-friendly portrait of a fictional clearly adult 20-year-old Indian woman from a rural village, "
              f"{scene_description}, natural youthful adult features, calm natural expression, fully clothed in simple tasteful Indian clothing, realistic skin texture, "
              "Authentic rural Indian setting, natural light and colors; avoid elderly or middle-aged appearance, studio glamour, city scenery, or illustration. Respectful and non-sexualized; no minors, suggestive posing, text, watermark, or logo. Portrait 4:5 framing. "
              "Use references only for broad visual style/composition; do not copy a person's identity or face."
          )
          references = publisher["upload_references"](api_key)
          reference = random.choice(references) if references else None
          image = publisher["generate_media"]("photo", prompt, publisher["IMAGE_MODEL"], api_key, reference)
          caption = f"A little moment from {scene_name}. Wishing everyone a lovely day."
          result = publisher["request_graph"](
              "POST",
              f"{page_id}/photos",
              data={"access_token": page_token, "message": caption, "published": "true"},
              files={"source": ("test-photo.jpg", io.BytesIO(image), "image/jpeg")},
          )
          post_id = result.get("post_id") or result.get("id")
          if not isinstance(post_id, str):
              raise RuntimeError("Meta did not return a published test photo ID.")
          print(f"Published one test photo as {post_id}.")
          PY

      - name: Inspect the recent published test photo
        if: github.event_name == 'workflow_dispatch' && inputs.verify_feed_only == true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
        run: |
          python - <<'PY'
          import os
          import runpy
          import requests
          from datetime import datetime, timedelta, timezone

          publisher = runpy.run_path("publish_experiment_content.py/publish_experiment_content.py")
          page_id = os.environ["FB_PAGE_ID"].strip()
          page_token = os.environ["FB_PAGE_ACCESS_TOKEN"].strip()
          scene_name, _ = publisher["PHOTO_SCENES"][0]
          expected = f"A little moment from {scene_name}. Wishing everyone a lovely day."
          fields = "id,message,created_time,permalink_url,is_published,attachments{media_type}"
          response = None
          for edge in (f"{page_id}/published_posts", f"{page_id}/feed"):
              try:
                  response = publisher["request_graph"](
                      "GET", edge, params={"access_token": page_token, "fields": fields, "limit": 25}
                  )
                  break
              except requests.HTTPError as error:
                  try:
                      details = error.response.json().get("error", {})
                  except (AttributeError, ValueError):
                      details = {}
                  print(f"Meta read failed for {edge}: code={details.get('code')}, message={details.get('message', 'unavailable')}")
          if response is None:
              raise RuntimeError("Meta rejected both Page published_posts and feed inspection requests.")
          cutoff = datetime.now(timezone.utc) - timedelta(hours=1)
          candidates = []
          for post in response.get("data", []):
              if not isinstance(post, dict) or post.get("message") != expected:
                  continue
              try:
                  created = datetime.fromisoformat(post["created_time"].replace("Z", "+00:00"))
              except (KeyError, TypeError, ValueError):
                  continue
              if created < cutoff:
                  continue
              attachment_data = post.get("attachments", {}).get("data", [])
              media_types = [item.get("media_type") for item in attachment_data if isinstance(item, dict)]
              candidates.append((post, created, media_types))
          if not candidates:
              raise RuntimeError("No matching recent post found in the Page post list.")
          verified = False
          for post, created, media_types in candidates:
              permalink = post.get("permalink_url")
              published = post.get("is_published")
              print(f"Post check: created={created.isoformat()}, is_published={published}, media_types={media_types}, permalink={permalink or 'unavailable'}")
              if published is True and isinstance(permalink, str) and "photo" in media_types:
                  verified = True
          if not verified:
              raise RuntimeError("Recent matching post was not confirmed as published with a photo attachment and permalink.")
          print("Verified a recent published Page post with a photo attachment and permalink.")
          PY

      - name: Generate and schedule three posts (midday video optional)
        if: github.event_name == 'schedule' || (inputs.test_photo_only != true && inputs.dry_run_only != true)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
          TIMEZONE: Asia/Kolkata
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL || 'black-forest-labs/flux.2-klein-4b' }}
          POLLINATIONS_VIDEO_MODEL: ${{ vars.POLLINATIONS_VIDEO_MODEL || 'google/veo-3.1-fast' }}
          VIDEO_DURATION_SECONDS: "4"
        run: python publish_experiment_content.py/publish_experiment_content.py

      - name: Persist duplicate-prevention state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Persist daily publishing state"
          file_pattern: data/publishing_state.json
