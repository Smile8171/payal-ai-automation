name: Daily Facebook content

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "Only validate the content plan; do not generate or publish media"
        required: false
        type: boolean
        default: true
      test_photo_only:
        description: "Generate one fresh unpublished photo, then attach it to one Page feed post"
        required: false
        type: boolean
        default: false
      verify_feed_only:
        description: "Inspect recent published photo permalink and attachment without publishing"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: payal-ai-automation-state
  cancel-in-progress: false

jobs:
  schedule-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate experiment plan without API calls
        run: python publish_experiment_content.py/publish_experiment_content.py --dry-run

      - name: Schedule one fresh photo as a Page feed post
        if: github.event_name == 'workflow_dispatch' && inputs.test_photo_only == true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
          TIMEZONE: Asia/Kolkata
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL || 'black-forest-labs/flux.2-klein-4b' }}
        run: |
          python - <<'PY'
          import os
          import runpy
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          publisher = runpy.run_path("publish_experiment_content.py/publish_experiment_content.py")
          page_id = os.environ["FB_PAGE_ID"].strip()
          token = os.environ["FB_PAGE_ACCESS_TOKEN"].strip()
          api_key = os.environ["POLLINATIONS_API_KEY"].strip()
          caption = "A peaceful sunrise in a village courtyard. Wishing everyone a lovely day."
          prompt = (
              "Photorealistic documentary-style portrait of a fictional clearly adult 20-year-old Indian woman "
              "in a quiet rural Indian village courtyard at sunrise, wearing simple tasteful everyday salwar kameez. "
              "Mud-plastered village home, plants, soft natural morning light, realistic youthful adult features and skin texture, "
              "calm natural expression, authentic rural background, family-friendly and non-sexualized. "
              "No minors, elderly or middle-aged appearance, studio glamour, city scenery, text, watermark, or logo. Portrait 4:5 framing."
          )
          image = publisher["generate_media"](
              "photo", prompt, os.getenv("POLLINATIONS_IMAGE_MODEL", publisher["IMAGE_MODEL"]), api_key
          )
          if not image:
              raise RuntimeError("Image generation returned empty media.")

          publish_at = datetime.now(ZoneInfo(os.environ["TIMEZONE"])) + timedelta(minutes=20)
          post_id = publisher["schedule_photo"](page_id, token, image, caption, publish_at)
          print("SCHEDULED_FEED_TEST", "post_id=", post_id, "publish_at=", publish_at.isoformat())
          PY

      - name: Diagnose Page photo and feed metadata (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_feed_only == true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
        run: |
          python - <<'PY'
          import os
          import runpy
          import requests

          publisher = runpy.run_path("publish_experiment_content.py/publish_experiment_content.py")
          page_id = os.environ["FB_PAGE_ID"].strip()
          token = os.environ["FB_PAGE_ACCESS_TOKEN"].strip()
          photo_id = "1544824481009285"
          expected = "A peaceful sunrise in a village courtyard. Wishing everyone a lovely day."

          def read(label, path, fields):
              try:
                  return publisher["request_graph"](
                      "GET", path, params={"access_token": token, "fields": fields, "limit": 25}
                  )
              except requests.HTTPError as error:
                  try:
                      details = error.response.json().get("error", {})
                  except (AttributeError, ValueError):
                      details = {}
                  print(f"READ_ONLY_ERROR {label}: code={details.get('code')}, subcode={details.get('error_subcode')}, message={details.get('message', 'unavailable')}")
                  return None

          photo = read("photo_metadata", photo_id, "id,created_time,name,from,link")
          if photo is None:
              photo = read("photo_minimal", photo_id, "id,created_time")
          if photo is not None:
              print(f"PHOTO_METADATA id={photo.get('id')}, created_time={photo.get('created_time')}, name={photo.get('name')}, link={photo.get('link')}")
              owner = photo.get("from")
              owner_id = owner.get("id") if isinstance(owner, dict) else None
              print(f"PHOTO_OWNER_MATCH_CONFIGURED_PAGE={owner_id == page_id}; PHOTO_OWNER_MATCH_PUBLIC_PAGE={owner_id == '100064452445545'}")

          feed = read("page_feed", f"{page_id}/feed", "id,message,created_time")
          candidates = [
              item for item in (feed or {}).get("data", [])
              if isinstance(item, dict) and item.get("message") == expected
          ]
          if not candidates:
              print("PAGE_FEED_MATCH none")
          for item in candidates:
              post_id = item.get("id")
              print(f"PAGE_FEED_MATCH id={post_id}, created_time={item.get('created_time')}")
              if not isinstance(post_id, str):
                  continue
              detail = read("post_detail", post_id, "id,message,created_time,permalink_url,is_published,privacy,status_type,attachments")
              if detail is None:
                  detail = read("post_detail_minimal", post_id, "id,message,created_time")
              visibility = read("post_visibility", post_id, "id,is_hidden,from")
              if detail is not None:
                  owner = (visibility or {}).get("from")
                  owner_id = owner.get("id") if isinstance(owner, dict) else None
                  owner_name = owner.get("name") if isinstance(owner, dict) else None
                  print("POST_METADATA", "id=", detail.get("id"), "created_time=", detail.get("created_time"), "is_published=", detail.get("is_published"), "is_hidden=", (visibility or {}).get("is_hidden"), "privacy=", detail.get("privacy"), "status_type=", detail.get("status_type"), "owner_matches_configured=", owner_id == page_id, "owner_name=", owner_name, "permalink=", detail.get("permalink_url"))
          PY

      - name: Generate and schedule three posts (midday video optional)
        if: github.event_name == 'schedule' || (inputs.test_photo_only != true && inputs.dry_run_only != true)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
          TIMEZONE: Asia/Kolkata
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL || 'black-forest-labs/flux.2-klein-4b' }}
          POLLINATIONS_VIDEO_MODEL: ${{ vars.POLLINATIONS_VIDEO_MODEL || 'google/veo-3.1-fast' }}
          VIDEO_DURATION_SECONDS: "4"
        run: python publish_experiment_content.py/publish_experiment_content.py

      - name: Persist duplicate-prevention state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Persist daily publishing state"
          file_pattern: data/publishing_state.json
