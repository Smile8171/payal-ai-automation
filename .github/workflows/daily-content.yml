name: Daily Facebook content

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: payal-ai-automation-state
  cancel-in-progress: false

jobs:
  schedule-content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and schedule daily content
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
          TIMEZONE: Asia/Kolkata
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python publish_daily_content.py

      - name: Persist duplicate-prevention state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Persist daily publishing state"
          file_pattern: data/publishing_state.json